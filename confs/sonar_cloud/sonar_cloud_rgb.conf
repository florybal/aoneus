general {
  base_exp_dir = "experiments/sonarcloud"
  recording = [
    "./"
    "./models"
  ]
}

dataset {
  data_dir = "data/SonarCloud"   # <- ALTERE AQUI
  ds_factor = 1.0
}

train {
  learning_rate = 0.0005
  learning_rate_alpha = 0.05
  end_iter = 5001
  batch_size = 512
  warm_up_end = 5000
  anneal_end = 0
  use_white_bkgd = false
  save_freq = 10000
  val_freq = 500
  val_mesh_freq = 1000
  report_freq = 100
  igr_weight = 0.1
  mask_weight = 0.0
  variation_weight = 0.0
}

model {
  sdf_network {
    d_out = 257
    d_in = 3
    d_hidden = 256
    n_layers = 8
    skip_in = [
      4
    ]
    multires = 6
    bias = 0.5
    scale = 1.0
    geometric_init = true
    weight_norm = true
  }
  variance_network {
    init_val = 0.3
  }
  rendering_network {
    d_feature = 64
    mode = "idr"
    d_in = 9
    d_out = 3
    d_hidden = 64
    n_layers = 4
    weight_norm = true
    multires_view = 4
    squeeze_out = true
  }
  neus_renderer {
    n_samples = 64
    n_importance = 64
    n_outside = 32
    up_sample_steps = 4
    perturb = 1.0
  }
}

mesh {
  x_max = 1.0      # <- AJUSTE COM BASE NA NUVEM DE PONTOS
  x_min = -1.0
  y_max = 1.0
  y_min = -1.0
  z_max = 1.0
  z_min = -1.0
  level_set = 0.0
  object_bbox_min = [-1.0, -1.0, -1.0]
  object_bbox_max = [1.0, 1.0, 1.0]
}