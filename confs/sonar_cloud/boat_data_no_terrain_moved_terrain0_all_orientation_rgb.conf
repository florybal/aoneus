general {
  expID = "experiments/boat_data_no_terrain_moved_terrain0_all_orientations"
  base_exp_dir  = "experiments/boat_data_no_terrain_moved_terrain0_all_orientations"
  recording = [
    "./"
    "./models"
  ]
}
dataset {
  data_dir = "data/SonarCloud/boat_data/no_terrain/moved_terrain0/all_orientations"

  render_cameras_name = "cameras_sphere.npz"
  object_cameras_name = "cameras_sphere.npz"
  ds_factor = 1.0
}
train {
  learning_rate = 0.0005
  learning_rate_alpha = 0.05
  end_iter = 101
  batch_size = 512
  validate_resolution_level = 4
  warm_up_end = 50
  anneal_end = 0
  use_white_bkgd = false
  save_freq = 10
  val_freq = 50
  val_mesh_freq = 10
  report_freq = 10
  igr_weight = 0.1
  mask_weight = 0.0
  variation_weight = 0.0
}
model {
  nerf {
    D = 8
    d_in = 4
    d_in_view = 3
    W = 256
    multires = 10
    multires_view = 4
    output_ch = 4
    skips = [
      4
    ]
    use_viewdirs = true
  }
  sdf_network {
    d_out = 257
    d_in = 3
    d_hidden = 256
    n_layers = 8
    skip_in = [
      4
    ]
    multires = 6
    bias = 0.5
    scale = 1.0
    geometric_init = true
    weight_norm = true
  }
  variance_network {
    init_val = 0.3
  }
  rendering_network {
    d_feature = 64
    mode = "idr"
    d_in = 9
    d_out = 3
    d_hidden = 64
    n_layers = 4
    weight_norm = true
    multires_view = 4
    squeeze_out = true
  }
  neus_renderer {
    n_samples = 64
    n_importance = 64
    n_outside = 32
    up_sample_steps = 4
    perturb = 1.0
  }
}metrics {
  enabled = true

  # Arquivo GT opcional (mesh .ply, .obj). Se vazio, usa GT gerado de depth maps
  gt_geometry = ""

  # Modo de alinhamento entre malha predita e GT: "centroid", "bbox_center" ou "none"
  align = "centroid"

  # Número máximo de pontos amostrados para comparação
  n_samples = 100000

  # Thresholds de precisão/recall em metros (1cm, 2cm, 5cm, 10cm, 20cm, 50cm)
  thresholds = [0.01, 0.02, 0.05, 0.10, 0.20, 0.50]

  # Se true, salva JSON individual por mesh
  save_per_mesh = true

  # Se true, mantém CSV consolidado
  save_csv = true
}